name: Validar Cercly STAGING

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-cercly-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Pruebas y APK debug STAGING
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configurar Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter 3.47.3
        uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: false

      - name: Mostrar versiones
        run: |
          flutter --version
          java -version

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar y probar
        run: |
          flutter analyze
          flutter test
          flutter test --dart-define=CERCLY_STAGING=true test/geofencing_experimental_service_test.dart test/staging_proximity_diagnostics_test.dart

      - name: Comprobar configuración Staging
        env:
          STAGING_KEY: ${{ vars.CERCLY_STAGING_PUBLISHABLE_KEY }}
        run: |
          case "$STAGING_KEY" in
            sb_publishable_*) ;;
            *) echo "Falta la variable publicable CERCLY_STAGING_PUBLISHABLE_KEY"; exit 1 ;;
          esac

      - name: Compilar APK debug Staging (no sustituye la Release validada)
        env:
          STAGING_KEY: ${{ vars.CERCLY_STAGING_PUBLISHABLE_KEY }}
        run: >-
          flutter build apk --debug
          --dart-define=CERCLY_STAGING=true
          --dart-define=SUPABASE_URL=https://dlajxviqhkdcqnmczhvr.supabase.co
          --dart-define="SUPABASE_PUBLISHABLE_KEY=$STAGING_KEY"

      - name: Preparar APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk Cercly-STAGING-CI-debug.apk

      - name: Subir APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Cercly-STAGING-CI-debug
          path: Cercly-STAGING-CI-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
