name: Compilar APK de Cercly

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-cercly-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configurar Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter 3.47.3
        uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: false

      - name: Mostrar versiones
        run: |
          flutter --version
          java -version

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK debug instalable
        run: >-
          flutter build apk --debug
          --dart-define=SUPABASE_URL=https://aimubazregckmjchnszf.supabase.co
          --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_ITO9El4_ipx11kSMgiCtqA_N-0SxpbK

      - name: Preparar APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk Cercly-actualizado.apk

      - name: Subir APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Cercly-APK
          path: Cercly-actualizado.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
